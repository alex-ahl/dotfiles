# Shared baseline for all workspace roles; role configs include this and override.

# Pull in user-level config (keybinds etc); wsg's --config-file replaces the
# default loader, so include explicitly.
config-file = ~/.config/ghostty/config

font-family = "MesloLGS NF"
font-size = 12

window-padding-x = 6
window-padding-y = 4
cursor-style = block
copy-on-select = clipboard
mouse-hide-while-typing = true

shell-integration = detect
# "title" makes the shell send OSC 7 (cwd), needed for the macOS titlebar
# proxy icon / Finder integration.
shell-integration-features = cursor,sudo,title
