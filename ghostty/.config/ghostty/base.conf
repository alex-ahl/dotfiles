# Shared baseline for all workspace roles.
# Role configs include this file and override what they need.

# Pull in the user-level config (keybinds etc) — wsg's --config-file
# replaces the default loader, so include explicitly.
config-file = ~/.config/ghostty/config

font-family = "MesloLGS NF"
font-size = 12

window-padding-x = 6
window-padding-y = 4
cursor-style = block
copy-on-select = clipboard
mouse-hide-while-typing = true

shell-integration = detect
# Include "title" so shell sends OSC 7 (cwd) — needed for macOS
# titlebar proxy icon / Finder integration.
shell-integration-features = cursor,sudo,title
