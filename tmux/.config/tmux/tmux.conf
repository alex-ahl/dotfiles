# Workspace tmux config on a dedicated socket (-L wsg) so it never
# collides with a user-level tmux setup.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:RGB"

# Propagate title + cwd to outer terminal (ghostty) so macOS titlebar /
# Finder proxy icon shows the current pane's folder.
set -g set-titles on
# pane_current_path is empty in the ai windows: their process runs as
# sandvault-alex and tmux can't read another user's cwd. session_path stands in.
set -g set-titles-string "#{session_name} — #{?#{pane_current_path},#{pane_current_path},#{session_path}}"

# Same git config pinning as zsh/.zshenv, because run-shell does NOT source it:
# the worktree bindings below (prefix + b / B / P) fetch and check out across
# many repos in one keypress, and a repo-local .git/config in the sandvault
# share could name a command to run as this account. -g reaches run-shell;
# `sv shell` uses env -i, so none of this leaks into an agent pane.
set-environment -g GIT_CONFIG_COUNT 4
set-environment -g GIT_CONFIG_KEY_0 core.hooksPath
set-environment -g GIT_CONFIG_VALUE_0 /dev/null
set-environment -g GIT_CONFIG_KEY_1 core.fsmonitor
set-environment -g GIT_CONFIG_VALUE_1 false
set-environment -g GIT_CONFIG_KEY_2 core.sshCommand
set-environment -g GIT_CONFIG_VALUE_2 ssh
set-environment -g GIT_CONFIG_KEY_3 core.pager
set-environment -g GIT_CONFIG_VALUE_3 cat

# Prefix: ctrl-space.
set -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

# prefix + ? : cheatsheet — every binding with a note (-N), mine (★) first.
# Give new bindings a "★ …" note to list them with the custom ones.
bind-key -N "★ Cheatsheet: search key bindings" ? display-popup -E -w 70% -h 80% \
  '{ echo "── mine"; tmux list-keys -N | grep ★; \
     echo; echo "── copy mode (prefix [)"; tmux list-keys -N -T copy-mode-vi -P "copy-mode "; \
     echo; echo "── tmux defaults"; tmux list-keys -N | grep -v ★; } \
   | fzf --reverse --no-sort --prompt "keys> "'

set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on

# Keyboard-only copying: prefix [ enters copy mode, / searches the scrollback,
# v starts a selection, y yanks it to the clipboard — pbcopy on macOS, OSC 52
# (set-clipboard) elsewhere, which reaches the local clipboard over ssh too.
setw -g mode-keys vi
set -g set-clipboard on
if-shell 'command -v pbcopy' 'set -s copy-command pbcopy'

bind-key -N "★ Start selection" -T copy-mode-vi v     send-keys -X begin-selection
bind-key -N "★ Toggle rectangle selection" -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind-key -N "★ Copy selection to clipboard" -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel
bind-key -N "★ Copy selection to clipboard" -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

# image.nvim (Kitty graphics protocol) needs tmux to forward the escape
# sequences untouched, and not to flag the image bytes as window activity.
set -gq allow-passthrough on
set -g visual-activity off

# Status bar: single line; subtle bg tint separates it from pane content.
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-left " "

# While the active pane runs ssh (a nested tmux, usually), this bar takes a
# warm tint, and an orange ← after the tabs marks the bar whose tmux gets the
# keys: this one, or after F12 the nested one, which @keys-here tells.
set -g status-style "#{?#{==:#{pane_current_command},ssh},bg=#33261a fg=#777777,bg=default fg=#555555}"
set -g @nest-arrow "#{?#{||:#{@keys-here},#{&&:#{==:#{pane_current_command},ssh},#{!=:#{client_key_table},off}}},#[fg=#FD971F#,bold]  ←#[default],}"
# tmux's default status-format, with the arrow added right after the tabs.
set -g 'status-format[0]' '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist]#{E:@nest-arrow}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

# F12: hand every key to the tmux running inside this pane — the prefix then
# works once instead of twice — until F12 again; the ← above goes away.
# Session-scoped, so other sessions keep their keys.
bind-key -N "★ Pass keys to nested tmux (F12 to return)" -T root F12 \
  set prefix None \; set key-table off \; \
  if-shell -F "#{==:#{pane_current_command},ssh}" "send-keys -H 1b 5b 39 39 39 38 7e" \; \
  refresh-client -S
bind-key -T off F12 \
  set -u prefix \; set -u key-table \; \
  if-shell -F "#{==:#{pane_current_command},ssh}" "send-keys -H 1b 5b 39 39 39 39 7e" \; \
  refresh-client -S

# The other end of F12: two private key codes (CSI 9998~ / 9999~, which no
# real key sends) that the outer tmux passes down the ssh pane, so the nested
# tmux can show the ← while the keys are its own.
set -s user-keys[0] "\e[9998~"
set -s user-keys[1] "\e[9999~"
bind-key -T root User0 set @keys-here 1 \; refresh-client -S
bind-key -T root User1 set -u @keys-here \; refresh-client -S
# A dropped connection never sends the "keys back" code; clear it on detach.
set-hook -g client-detached "set -u @keys-here"

# Git branch/worktree + session + pane path (~ substituted).
set -g status-interval 5
# Agent badge: sandboxed, host = agent running outside the sandbox, nothing
# = ordinary pane. Derived from the pane's process tree (see agent-badge.sh),
# not from the window name or launch command: those only ever matched the wsg
# ai-* windows, so an agent started by hand — e.g. in `home` under ~/git — went
# unbadged. The script emits its own #[fg=…] styling.
set -g status-right "#(~/.scripts/agent-badge.sh '#{pane_pid}')#[fg=#A6E22E]#(~/.scripts/git-status.sh '#{?#{pane_current_path},#{pane_current_path},#{session_path}}')  #[fg=#5EC4FF]#S  #[fg=#888888]#{s|/Users/Shared/sv-$USER|~|:#{s|$HOME|~|:#{?#{pane_current_path},#{pane_current_path},#{session_path}}}} "
set -g status-right-length 120

# Color windows by role; active gets underline + bold.
# ## escapes a literal #; bare #F/#W/#S are tmux format shortcuts.
set -g window-status-separator "  "
set -g window-status-format         "#[fg=#{?#{==:#W,ai-1},##F9A03F,#{?#{==:#W,ai-2},##9A78FF,#{?#{==:#W,dev},##5EC4FF,##aaaaaa}}}]#W"
set -g window-status-current-format "#[fg=#{?#{==:#W,ai-1},##F9A03F,#{?#{==:#W,ai-2},##9A78FF,#{?#{==:#W,dev},##5EC4FF,##ffffff}}},bold,underscore]#W"

# prefix + c : new window named "shell" in current cwd.
bind-key -N "★ New shell window in current dir" c new-window -n shell -c "#{pane_current_path}"

# Keep window names fixed (no auto-rename).
set -g allow-rename off
setw -g automatic-rename off

# prefix + f : fzf session picker (workspace + path columns; name hidden).
bind-key -N "★ Switch session (fzf)" f display-popup -E -w 80% -h 50% \
  "tmux ls -F '#{?#{@workspace},#{@workspace},#{session_name}}|#{s|/Users/Shared/sv-alex|~|:#{s|/Users/alex|~|:#{session_path}}}|#{session_name}' \
   | column -t -s '|' \
   | fzf --reverse --with-nth=1,2 \
   | awk '{print \$NF}' \
   | xargs -r tmux switch-client -t"

# prefix + K : fzf-pick a session to kill (same UI as `f`). Refuses to kill
# 'home'; if you kill your current session, jumps to 'home' first.
bind-key -N "★ Kill a session (fzf)" K display-popup -E -w 80% -h 50% '~/.scripts/kill-session.sh'

# prefix + N : fzf-pick a workspace, then start/attach its wsg session
# (shell/shell/dev/ai-1/ai-2). Candidates: ~/git repo roots with bare ones
# expanded to their worktrees (no source subdirs like dotfiles/agents), plus the
# handful of dirs outside ~/git worth working in — ~/.config/*, ~/.scripts, the
# claude accounts, ~/brain (its own repo, so it never shows up under ~/git).
# Paths are shown ~-relative and expanded again on the pick: repo-resolve emits
# the physical share path (see 1e5c41b), too long to read in fzf.
# The ~/git guard runs before fzf and holds the popup with `read`: fzf takes the
# whole screen and `-E` closes the popup on exit, so anything written to stderr
# after this point is painted over and never seen.
bind-key -N "★ Open workspace (fzf)" N display-popup -E -w 70% -h 60% \
  '[ -d ~/git ] || { echo "~/git is missing — run ./install.sh in the dotfiles repo"; \
                     read -r _; exit 1; }; \
   root=$(cd ~/git && pwd -P); g="~/git/"; t="~/"; \
   sel=$({ ~/.scripts/shared/repo-resolve.sh --list-workspaces; \
           find -L ~/.config -maxdepth 1 -type d; \
           find -L ~/.scripts ~/.claude-account1 ~/.claude-account2 ~/brain \
                -maxdepth 0 -type d; } 2>/dev/null \
         | sed -e "s|^$root/|~/git/|" -e "s|^$HOME/|~/|" \
         | fzf --reverse) && [ -n "$sel" ] \
    && case "$sel" in "~/git/"*) dir="$root/${sel#$g}" ;; \
                      "~/"*)     dir="$HOME/${sel#$t}" ;; \
                      *)         dir="$sel" ;; esac \
    && cd "$dir" && exec ~/.scripts/workspace.sh'

# prefix + b : new worktree from anywhere. fzf-pick a project, type a branch;
# wt-new fetches + branches off latest origin/<default>, then its post-switch
# hook drops you in the new wsg session.
bind-key -N "★ New worktree + branch" b display-popup -E -w 70% -h 60% \
  '[ -d ~/git ] || { echo "~/git is missing — run ./install.sh in the dotfiles repo"; \
                     read -r _; exit 1; }; \
   root=$(cd ~/git && pwd -P); g="~/git/"; \
   dir=$(~/.scripts/shared/repo-resolve.sh --list 2>/dev/null \
         | sed "s|^$root/|~/git/|" \
         | fzf --reverse --prompt "project> ") \
   && [ -n "$dir" ] \
   && printf "new branch name: " && read branch \
   && [ -n "$branch" ] \
   && ~/.scripts/wt-new.sh "$root/${dir#$g}" "$branch"'

# prefix + G : new GitHub repo — pick owner, name, private/public; master +
# development, protected; clones it into ~/git/<personal|work> and opens its
# workspace. See ~/.scripts/new-repo.sh.
bind-key -N "★ New GitHub repo + workspace" G display-popup -E -w 70% -h 60% \
  '~/.scripts/new-repo.sh \
     || { printf "\n[new repo failed — press enter to close] "; read -r _; }'

# prefix + W : start a wsg in the current pane's cwd.
bind-key -N "★ Start workspace in current dir" W run-shell 'cd "#{pane_current_path}" && ~/.scripts/workspace.sh'

# prefix + R : relaunch this agent pane, resuming its conversation. The way back
# after approving a domain — srt reads its allowlist at startup, so the running
# pane still has the old policy. Refuses on sessions scaffolded before
# @wsg_agent existed rather than guessing the launch context away. The path
# falls back to #{session_path} like status-right does: an agent pane runs as
# another user, so tmux cannot read its cwd and #{pane_current_path} is empty.
bind-key -N "★ Relaunch agent pane, resume conversation" R run-shell '~/.scripts/agent-relaunch.sh "#{pane_id}" "#{window_name}" "#{?#{pane_current_path},#{pane_current_path},#{session_path}}"'

# prefix + B : rehome — fresh worktree+session from this one, carrying in-progress
# work. PR merged: branch off latest main, move changes, tear down old. Not merged
# (after confirm): branch off HEAD, copy changes, keep old. Prompts for name.
# See ~/.scripts/wt-rehome.sh. -d sets cwd because display-popup does NOT expand
# #{...} in the command body (only in flag args like -d), so cd "#{pane_current_path}"
# would fail and slam the popup shut.
bind-key -N "★ Rehome worktree, carrying changes" B display-popup -E -d "#{pane_current_path}" -w 72 -h 12 \
  'printf "new worktree name: "; IFS= read -r name; \
   [ -n "$name" ] || exit; \
   ~/.scripts/wt-rehome.sh "$name" \
     || { printf "\n[rehome failed — press enter to close] "; read -r _; }'

# prefix + P : prune — sweep wsg sessions, remove finished ones (branch merged via
# gh, or upstream gone): removes worktree + kills session (regular repos: switch to
# default + delete branch). Shows a plan to confirm. Saves Claude /handoff first.
# See ~/.scripts/wt-prune.sh.
bind-key -N "★ Prune finished worktrees/sessions" P display-popup -E -w 80% -h 70% \
  'printf "Save Claude context? [a]ll / [s]elect per-session / [N]one "; IFS= read -r hc; \
   case "$hc" in \
     [aA]*) "$HOME"/.scripts/wt-prune.sh ;; \
     [sS]*) "$HOME"/.scripts/wt-prune.sh --handoff-ask ;; \
     *)     "$HOME"/.scripts/wt-prune.sh --no-handoff ;; \
   esac; \
   printf "\n[press enter to close] "; read -r _'

# prefix + X : confirm, then kill current session and jump back to 'home'.
bind-key -N "★ Kill current session, go home" X confirm-before -p "kill session '#{session_name}'? (y/N) " " \
  run-shell -b ' \
    cur=\"#{session_name}\"; \
    TMUX_BIN=/opt/homebrew/bin/tmux; [ -x \"\$TMUX_BIN\" ] || TMUX_BIN=tmux; \
    if [ \"\$cur\" = home ]; then \
      \"\$TMUX_BIN\" display-message \"home session cannot be killed\"; exit 0; \
    fi; \
    \"\$TMUX_BIN\" has-session -t home 2>/dev/null || \"\$TMUX_BIN\" new-session -d -s home -n shell -c \"\$HOME/git\"; \
    \"\$TMUX_BIN\" switch-client -t home; \
    \"\$TMUX_BIN\" kill-session -t \"\$cur\"'"

# Pane borders: uniform gray. Active pane is marked only by its orange number
# in the strip below, so border color never bleeds onto shared edges/corners.
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#333333"

# Heavy borders; per-pane number strip on top (active = orange bold, inactive =
# gray). indicators=off so active orange doesn't bleed onto shared edges.
set -g pane-border-lines heavy
set -g pane-border-format " #{?pane_active,#[fg=#F9A03F#,bold],#[fg=#555555]}#{pane_index} "
set -g pane-border-indicators off

# Show the number strip only with 2+ panes; hide for a lone pane.
# window-layout-changed fires on split/kill/resize.
set -g pane-border-status off
set-hook -g window-layout-changed \
  'if-shell -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'
