# Workspace tmux config. Loaded via dedicated socket (-L wsg) so it
# never collides with a user-level tmux setup.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:RGB"

# Propagate window title + cwd to outer terminal (ghostty), so
# macOS titlebar / Finder proxy icon shows the current pane's folder.
set -g set-titles on
set -g set-titles-string "#{session_name} — #{pane_current_path}"

# Prefix: ctrl-space.
set -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g history-limit 50000
set -g escape-time 10

# Status bar: single line, subtle bg tint provides visual separation
# from pane content (no extra row needed).
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#555555"
set -g status-left " "
# Git branch/worktree + session name + full pane path (with ~ substitution).
set -g status-interval 5
set -g status-right "#[fg=#A6E22E]#(~/.scripts/git-status.sh '#{pane_current_path}')  #[fg=#5EC4FF]#S  #[fg=#888888]#{s|/Users/alex|~|:#{pane_current_path}} "
set -g status-right-length 120

# Color every window by role; mark active w/ underline + bold.
# Note: ## escapes literal # — bare #F, #W, #S etc are tmux format shortcuts.
set -g window-status-separator "  "
set -g window-status-format         "#[fg=#{?#{==:#W,ai-1},##F9A03F,#{?#{==:#W,ai-2},##9A78FF,#{?#{==:#W,dev},##5EC4FF,##aaaaaa}}}]#W"
set -g window-status-current-format "#[fg=#{?#{==:#W,ai-1},##F9A03F,#{?#{==:#W,ai-2},##9A78FF,#{?#{==:#W,dev},##5EC4FF,##ffffff}}},bold,underscore]#W"

# prefix + c (and S) : new window always named "shell" in current cwd.
bind-key c new-window -n shell -c "#{pane_current_path}"
bind-key S new-window -n shell -c "#{pane_current_path}"

# Don't let shells/programs auto-rename windows.
set -g allow-rename off
setw -g automatic-rename off

# prefix + f : fzf session picker. Workspace + path columns, session name hidden.
bind-key f display-popup -E -w 80% -h 50% \
  "tmux ls -F '#{?#{@workspace},#{@workspace},#{session_name}}|#{s|/Users/alex|~|:#{session_path}}|#{session_name}' \
   | column -t -s '|' \
   | fzf --reverse --with-nth=1,2 \
   | awk '{print \$NF}' \
   | xargs -r tmux switch-client -t"

# prefix + K : fzf-pick a session to *kill* (same picker UI as `f`). Refuses
# to kill 'home'; if you kill the session you're in, jumps to 'home' first.
bind-key K display-popup -E -w 80% -h 50% '~/.scripts/kill-session.sh'

# prefix + N : pick a project from ~/git and start (or attach) a wsg there.
bind-key N display-popup -E -w 70% -h 60% \
  'dir=$(find ~/git -mindepth 1 -maxdepth 2 -type d \
           ! -path "*/.git*" ! -path "*/node_modules*" 2>/dev/null \
         | fzf --reverse) && [ -n "$dir" ] && cd "$dir" && ~/.scripts/workspace.sh'

# prefix + b : new worktree from anywhere. fzf-pick a project, type a
# branch name, wt creates the worktree; its post-switch hook drops you
# in the new wsg session. -C targets the project without cd-ing home.
bind-key b display-popup -E -w 70% -h 60% \
  'dir=$(find ~/git -mindepth 1 -maxdepth 2 -type d \
           ! -path "*/.git*" ! -path "*/node_modules*" 2>/dev/null \
         | fzf --reverse --prompt "project> ") \
   && [ -n "$dir" ] \
   && printf "new branch name: " && read branch \
   && [ -n "$branch" ] \
   && wt -y -C "$dir" switch -c "$branch"'

# prefix + W : start a wsg in the current pane's cwd.
bind-key W run-shell 'cd "#{pane_current_path}" && ~/.scripts/workspace.sh'

# prefix + M : rehome — start a fresh worktree+session from this one, carrying
# in-progress work. If the PR is merged: branch off latest main, move changes,
# tear down the old. If not merged (after confirm): branch off current HEAD,
# copy changes, keep the old. Prompts for the new name. See ~/.scripts/wt-rehome.sh.
# Use -d for the working dir: display-popup does NOT format-expand #{...} inside
# the command body (only in flag args like -d), so `cd "#{pane_current_path}"`
# would fail and slam the popup shut. The popup inherits -d as its cwd.
bind-key M display-popup -E -d "#{pane_current_path}" -w 64 -h 4 \
  'printf "new worktree name: "; IFS= read -r name; \
   [ -n "$name" ] || exit; \
   ~/.scripts/wt-rehome.sh "$name" \
     || { printf "\n[rehome failed — press enter to close] "; read -r _; }'

# prefix + P : prune — sweep all wsg sessions and remove the finished ones
# (branch merged via gh, or upstream gone): removes the worktree + kills the
# session (regular repos: switch to default + delete branch). Shows a plan and
# asks to confirm. Saves Claude /handoff context first. See ~/.scripts/wt-prune.sh.
bind-key P display-popup -E -w 80% -h 70% \
  'printf "Save Claude /handoff context first? [y/N] "; IFS= read -r hc; \
   case "$hc" in [yY]*) "$HOME"/.scripts/wt-prune.sh ;; \
                 *)     "$HOME"/.scripts/wt-prune.sh --no-handoff ;; esac; \
   printf "\n[press enter to close] "; read -r _'

# prefix + X : confirm, then kill current session and jump back to 'home'.
bind-key X confirm-before -p "kill session '#{session_name}'? (y/N) " " \
  run-shell -b ' \
    cur=\"#{session_name}\"; \
    TMUX_BIN=/opt/homebrew/bin/tmux; \
    if [ \"\$cur\" = home ]; then \
      \"\$TMUX_BIN\" display-message \"home session cannot be killed\"; exit 0; \
    fi; \
    \"\$TMUX_BIN\" new-session -dA -s home -n shell -c \"\$HOME/git\"; \
    \"\$TMUX_BIN\" switch-client -t home; \
    \"\$TMUX_BIN\" kill-session -t \"\$cur\"'"

# prefix + G : fzf-pick a folder, then launch the full wsg workspace there
# (shell/dev/ai-1/ai-2). Candidates are ~/git projects+worktrees (depth 1-2)
# plus hidden home dirs and their immediate children (e.g. ~/.config/nvim).
# No sort: git entries are listed first so they stay at the top of fzf.
# workspace.sh derives the session name and switches in place.
bind-key G display-popup -E -w 70% -h 60% \
  'dir=$({ find ~/git -mindepth 1 -maxdepth 2 -type d \
             ! -path "*/.git*" ! -path "*/node_modules*"; \
           find ~/.[^.]* -maxdepth 1 -type d; } 2>/dev/null \
         | fzf --reverse) && [ -n "$dir" ] \
    && cd "$dir" && exec ~/.scripts/workspace.sh'

# Pane borders: uniform gray on all lines. Active pane is marked only
# by its orange number in the strip below, so the border color never
# bleeds along edges/corners shared with neighbor panes.
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#333333"

# Heavy borders; per-pane number strip on top (active = orange bold,
# inactive = gray). indicators=off so the active orange doesn't bleed
# along edges shared with neighbor panes.
set -g pane-border-lines heavy
set -g pane-border-format " #{?pane_active,#[fg=#F9A03F#,bold],#[fg=#555555]}#{pane_index} "
set -g pane-border-indicators off

# Show the number strip only when a window has 2+ panes; hide it for
# a lone pane. window-layout-changed fires on split/kill/resize.
set -g pane-border-status off
set-hook -g window-layout-changed \
  'if-shell -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'
