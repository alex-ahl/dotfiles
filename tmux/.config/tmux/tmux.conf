# Workspace tmux config on a dedicated socket (-L wsg) so it never
# collides with a user-level tmux setup.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:RGB"

# Propagate title + cwd to outer terminal (ghostty) so macOS titlebar /
# Finder proxy icon shows the current pane's folder.
set -g set-titles on
# pane_current_path is empty in the ai windows: their process runs as
# sandvault-alex and tmux can't read another user's cwd. session_path stands in.
set -g set-titles-string "#{session_name} — #{?#{pane_current_path},#{pane_current_path},#{session_path}}"

# Prefix: ctrl-space.
set -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on

# Status bar: single line; subtle bg tint separates it from pane content.
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#555555"
set -g status-left " "
# Git branch/worktree + session + pane path (~ substituted).
set -g status-interval 5
# Agent badge: sandboxed, host = agent running outside the sandbox, nothing
# = ordinary pane. Derived from the pane's process tree (see agent-badge.sh),
# not from the window name or launch command: those only ever matched the wsg
# ai-* windows, so an agent started by hand — e.g. in `home` under ~/git — went
# unbadged. The script emits its own #[fg=…] styling.
set -g status-right "#(~/.scripts/agent-badge.sh '#{pane_pid}')#[fg=#A6E22E]#(~/.scripts/git-status.sh '#{?#{pane_current_path},#{pane_current_path},#{session_path}}')  #[fg=#5EC4FF]#S  #[fg=#888888]#{s|/Users/Shared/sv-alex|~|:#{s|/Users/alex|~|:#{?#{pane_current_path},#{pane_current_path},#{session_path}}}} "
set -g status-right-length 120

# Color windows by role; active gets underline + bold.
# ## escapes a literal #; bare #F/#W/#S are tmux format shortcuts.
set -g window-status-separator "  "
set -g window-status-format         "#[fg=#{?#{==:#W,ai-1},##F9A03F,#{?#{==:#W,ai-2},##9A78FF,#{?#{==:#W,dev},##5EC4FF,##aaaaaa}}}]#W"
set -g window-status-current-format "#[fg=#{?#{==:#W,ai-1},##F9A03F,#{?#{==:#W,ai-2},##9A78FF,#{?#{==:#W,dev},##5EC4FF,##ffffff}}},bold,underscore]#W"

# prefix + c / S : new window named "shell" in current cwd.
bind-key c new-window -n shell -c "#{pane_current_path}"
bind-key S new-window -n shell -c "#{pane_current_path}"

# Keep window names fixed (no auto-rename).
set -g allow-rename off
setw -g automatic-rename off

# prefix + f : fzf session picker (workspace + path columns; name hidden).
bind-key f display-popup -E -w 80% -h 50% \
  "tmux ls -F '#{?#{@workspace},#{@workspace},#{session_name}}|#{s|/Users/Shared/sv-alex|~|:#{s|/Users/alex|~|:#{session_path}}}|#{session_name}' \
   | column -t -s '|' \
   | fzf --reverse --with-nth=1,2 \
   | awk '{print \$NF}' \
   | xargs -r tmux switch-client -t"

# prefix + K : fzf-pick a session to kill (same UI as `f`). Refuses to kill
# 'home'; if you kill your current session, jumps to 'home' first.
bind-key K display-popup -E -w 80% -h 50% '~/.scripts/kill-session.sh'

# prefix + N : fzf-pick a workspace, then start/attach its wsg session
# (shell/dev/ai-1/ai-2). Candidates: ~/git repo roots with bare ones expanded to
# their worktrees (no source subdirs like dotfiles/agents), plus the handful of
# dirs outside ~/git worth working in — ~/.config/*, ~/.scripts, the claude
# accounts, ~/brain (its own repo, so it never shows up under ~/git).
# Paths are shown ~-relative and expanded again on the pick: repo-resolve emits
# the physical share path (see 1e5c41b), too long to read in fzf.
bind-key N display-popup -E -w 70% -h 60% \
  'root=$(cd ~/git && pwd -P); g="~/git/"; t="~/"; \
   sel=$({ ~/.scripts/repo-resolve.sh --list-workspaces; \
           find -L ~/.config -maxdepth 1 -type d; \
           find -L ~/.scripts ~/.claude-account1 ~/.claude-account2 ~/brain \
                -maxdepth 0 -type d; } 2>/dev/null \
         | sed -e "s|^$root/|~/git/|" -e "s|^$HOME/|~/|" \
         | fzf --reverse) && [ -n "$sel" ] \
    && case "$sel" in "~/git/"*) dir="$root/${sel#$g}" ;; \
                      "~/"*)     dir="$HOME/${sel#$t}" ;; \
                      *)         dir="$sel" ;; esac \
    && cd "$dir" && exec ~/.scripts/workspace.sh'

# prefix + b : new worktree from anywhere. fzf-pick a project, type a branch;
# wt-new fetches + branches off latest origin/<default>, then its post-switch
# hook drops you in the new wsg session.
bind-key b display-popup -E -w 70% -h 60% \
  'root=$(cd ~/git && pwd -P); g="~/git/"; \
   dir=$(~/.scripts/repo-resolve.sh --list 2>/dev/null \
         | sed "s|^$root/|~/git/|" \
         | fzf --reverse --prompt "project> ") \
   && [ -n "$dir" ] \
   && printf "new branch name: " && read branch \
   && [ -n "$branch" ] \
   && ~/.scripts/wt-new.sh "$root/${dir#$g}" "$branch"'

# prefix + W : start a wsg in the current pane's cwd.
bind-key W run-shell 'cd "#{pane_current_path}" && ~/.scripts/workspace.sh'

# prefix + R : relaunch this agent pane, resuming its conversation. The way back
# after approving a domain — srt reads its allowlist at startup, so the running
# pane still has the old policy. Refuses on sessions scaffolded before
# @wsg_agent existed rather than guessing the launch context away. The path
# falls back to #{session_path} like status-right does: an agent pane runs as
# another user, so tmux cannot read its cwd and #{pane_current_path} is empty.
bind-key R run-shell '~/.scripts/agent-relaunch.sh "#{pane_id}" "#{window_name}" "#{?#{pane_current_path},#{pane_current_path},#{session_path}}"'

# prefix + M : rehome — fresh worktree+session from this one, carrying in-progress
# work. PR merged: branch off latest main, move changes, tear down old. Not merged
# (after confirm): branch off HEAD, copy changes, keep old. Prompts for name.
# See ~/.scripts/wt-rehome.sh. -d sets cwd because display-popup does NOT expand
# #{...} in the command body (only in flag args like -d), so cd "#{pane_current_path}"
# would fail and slam the popup shut.
bind-key M display-popup -E -d "#{pane_current_path}" -w 72 -h 12 \
  'printf "new worktree name: "; IFS= read -r name; \
   [ -n "$name" ] || exit; \
   ~/.scripts/wt-rehome.sh "$name" \
     || { printf "\n[rehome failed — press enter to close] "; read -r _; }'

# prefix + P : prune — sweep wsg sessions, remove finished ones (branch merged via
# gh, or upstream gone): removes worktree + kills session (regular repos: switch to
# default + delete branch). Shows a plan to confirm. Saves Claude /handoff first.
# See ~/.scripts/wt-prune.sh.
bind-key P display-popup -E -w 80% -h 70% \
  'printf "Save Claude context? [a]ll / [s]elect per-session / [N]one "; IFS= read -r hc; \
   case "$hc" in \
     [aA]*) "$HOME"/.scripts/wt-prune.sh ;; \
     [sS]*) "$HOME"/.scripts/wt-prune.sh --handoff-ask ;; \
     *)     "$HOME"/.scripts/wt-prune.sh --no-handoff ;; \
   esac; \
   printf "\n[press enter to close] "; read -r _'

# prefix + X : confirm, then kill current session and jump back to 'home'.
bind-key X confirm-before -p "kill session '#{session_name}'? (y/N) " " \
  run-shell -b ' \
    cur=\"#{session_name}\"; \
    TMUX_BIN=/opt/homebrew/bin/tmux; \
    if [ \"\$cur\" = home ]; then \
      \"\$TMUX_BIN\" display-message \"home session cannot be killed\"; exit 0; \
    fi; \
    \"\$TMUX_BIN\" new-session -dA -s home -n shell -c \"\$HOME/git\"; \
    \"\$TMUX_BIN\" switch-client -t home; \
    \"\$TMUX_BIN\" kill-session -t \"\$cur\"'"

# Pane borders: uniform gray. Active pane is marked only by its orange number
# in the strip below, so border color never bleeds onto shared edges/corners.
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#333333"

# Heavy borders; per-pane number strip on top (active = orange bold, inactive =
# gray). indicators=off so active orange doesn't bleed onto shared edges.
set -g pane-border-lines heavy
set -g pane-border-format " #{?pane_active,#[fg=#F9A03F#,bold],#[fg=#555555]}#{pane_index} "
set -g pane-border-indicators off

# Show the number strip only with 2+ panes; hide for a lone pane.
# window-layout-changed fires on split/kill/resize.
set -g pane-border-status off
set-hook -g window-layout-changed \
  'if-shell -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'
